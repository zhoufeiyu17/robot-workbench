<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>服务运维 · 机器人工作台</title>
  <link rel="stylesheet" href="/web/style.css">
  <style>
    :root{font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#233650;background:#f0f3f8}*{box-sizing:border-box}body{margin:0}header{border-bottom:1px solid #d5deea;background:#fff;padding:18px max(20px,calc((100% - 1180px)/2));display:flex;justify-content:space-between;align-items:center;gap:18px;flex-wrap:wrap}header h1{font-size:19px;margin:0}header p{font-size:12px;color:#66758a;margin:3px 0 0}header nav{display:flex;align-items:center;gap:18px;flex-wrap:wrap}a{color:#24619a;text-underline-offset:3px}select{font:inherit;min-height:40px;border:1px solid #bdccdf;border-radius:7px;background:#f5f8fc;color:#233650;padding:8px}select:focus-visible,a:focus-visible{outline:3px solid #74a6d5;outline-offset:3px}main{max-width:1220px;margin:auto;padding:24px 20px}footer{color:#66758a;font-size:12px;text-align:center;padding:0 20px 24px}
  </style>
</head>
<body>
  <header>
    <div><h1>机器人工作台 · 服务运维</h1><p>独立管理入口 · 业务页面不可用时仍可核验服务</p></div>
    <nav aria-label="运维页面导航">
      <label for="environment">目标环境 <select id="environment"><option value="physical">Physical · 物理设备</option><option value="fake">Fake · 开发设备</option></select></label>
      <a id="operations-return" href="/">返回工作台</a>
    </nav>
  </header>
  <main><section data-workbench-operations data-operations-standalone="true" aria-label="服务运维面板"></section></main>
  <footer>操作范围与允许性由目标管理服务核验；超时或管理器中断不代表服务已退出。</footer>
  <script type="module">
    import {createOperations} from '/web/operations.js';
    import {mountPhysicalEndpoint} from '/web/physical_endpoint.js';
    const operations=document.querySelector('[data-workbench-operations]').workbenchOperations;
    const access=mountPhysicalEndpoint({document,fetch:window.fetch.bind(window),location:window.location,crypto:window.crypto,container:operations.elements.groups[0].node,showControlAlerts:false});
    document.getElementById('environment').addEventListener('change',event=>access.setEnvironment(event.target.value));
    window.addEventListener('pagehide',()=>access.destroy());
  </script>
</body>
</html>
