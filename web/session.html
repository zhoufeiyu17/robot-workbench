<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>开发服务 · 机器人工作台</title>
  <link rel="stylesheet" href="/web/style.css">
</head>
<body>
  <main id="session-management" class="session-page">
    <header class="session-heading"><span class="eyebrow">ROBOT WORKBENCH · FAKE</span><h1>开发服务 · 兼容状态入口</h1><p id="session-profile">正在核验开发服务类型。这里不连接真机。</p></header>
    <section class="panel session-card" aria-labelledby="session-state">
      <div class="panel-heading"><h2 id="session-state">正在核验服务…</h2><span class="badge">每秒更新</span></div>
      <p id="session-message" role="status" aria-live="polite"></p>
      <p id="session-stage" class="hint"></p>
      <dl class="detail-list session-times"><dt>服务期限</dt><dd id="session-deadline">等待核验</dd><dt>退出方式</dt><dd id="session-remaining">等待核验</dd></dl>
      <p id="session-guidance" class="hint">此入口只读。开发服务的准备、停止与设备接入均在统一服务运维完成。</p>
      <p id="session-error" class="alert" role="alert" hidden></p>
      <p id="session-request" class="request-status" role="status" aria-live="polite"></p>
      <p>此兼容入口只读。环境启停、准备与恢复由同一个运维执行者管理。</p>
      <a id="session-operations" class="session-enter" href="/operations?environment=fake&amp;business=calibration">进入统一服务运维 →</a>
      <a id="session-enter" class="session-enter" href="/" hidden>进入工作台 →</a>
      <details class="technical-details"><summary>服务诊断信息</summary><pre id="session-details">等待核验</pre></details>
    </section>
    <section class="session-notes"><h2>停止与恢复</h2><p>停止会中断正在运行的 fake 任务，并保留已保存的数据。重新启动不会自动续跑旧动作；进入工作台后重新核对状态与计划。</p><p id="session-lifetime-guidance">正在核验服务期限与退出方式。</p></section>
  </main>
  <script type="module" src="/web/session.js"></script>
</body>
</html>
